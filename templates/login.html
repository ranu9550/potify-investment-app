<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Potify</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: #4b35d7;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #4b35d7;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .error {
            background: #ffebee;
            color: #d32f2f;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">Potify</div>

    <div class="subtitle">
        Login to manage your investments
    </div>

    {% if form.errors %}
        <div class="error">
            Username or password is incorrect.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
